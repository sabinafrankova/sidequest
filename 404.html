<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Sidequest</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23D9CCFF' stroke='%231A1430' stroke-width='2.5'/%3E%3Ctext x='20' y='28.5' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='23' fill='%231A1430'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!--
  GitHub Pages shows this page for any address on the site that doesn't exist.
  Broken links inside the site (like #banana) show the same design from index.html instead.
-->
<style>
:root {
  --paper: #FAF7FF; --ink: #1A1430; --ink-soft: #4E4766; --lilac: #D9CCFF; --mint: #CFF7B5; --violet: #6236E8;
  --pink: #FFC2DC; --butter: #FFE98A; --white: #FFFFFF;
  --font-display: "Unbounded", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --fs-title: clamp(34px, min(7.4vw, 9.5vh), 80px);
  --fs-btn: clamp(20px, 2.2vw, 24px);
  --gutter: clamp(16px, 4vw, 32px);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; background: var(--paper); color: var(--ink); font: 18px/1.55 var(--font-body); }
p { margin: 0; }
h1 { margin: 0; font: 800 var(--fs-title)/1.04 var(--font-display); letter-spacing: -0.03em; text-wrap: balance; max-width: 16ch; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1200px; margin-inline: auto; padding-inline: var(--gutter); }

.topbar { border-bottom: 2px solid var(--ink); }
.topbar .wrap { display: flex; align-items: center; min-height: 76px; }
.logo { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.logo-mark { display: grid; place-items: center; width: 42px; height: 42px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--lilac); perspective: 140px; }
.logo-s { display: inline-block; font: 800 24px/1 var(--font-display); text-shadow: 2px 2px 0 var(--mint); }
.logo:hover .logo-s { animation: twist .8s ease-in-out 1; }
@keyframes twist { to { transform: rotateY(360deg); } }
.logo-word { font: 800 20px/1 var(--font-display); letter-spacing: -0.02em; }

.nf { display: grid; justify-items: center; align-content: center; gap: 24px; padding-block: 48px 32px; text-align: center; }
.nf-digits { display: flex; gap: clamp(10px, 2vw, 22px); margin-bottom: 16px; }
.nf-d {
  display: grid; place-items: center; width: clamp(84px, 17vw, 168px); aspect-ratio: 1;
  border: 2px solid var(--ink); border-radius: 32px; box-shadow: 6px 6px 0 var(--ink);
  font: 800 clamp(56px, 12vw, 124px)/1 var(--font-display); user-select: none;
}
.nf-d1 { background: var(--mint); transform: rotate(-8deg); }
.nf-d2 { background: var(--pink); border-radius: 50%; animation: bob 2.6s ease-in-out infinite; }
.nf-d3 { background: var(--butter); transform: rotate(7deg); }
.nf-d1:hover { animation: wiggle-l .5s ease; }
.nf-d3:hover { animation: wiggle-r .5s ease; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(10deg); } }
@keyframes wiggle-l { 0%, 100% { transform: rotate(-8deg); } 30% { transform: rotate(-20deg) scale(1.05); } 60% { transform: rotate(2deg); } }
@keyframes wiggle-r { 0%, 100% { transform: rotate(7deg); } 30% { transform: rotate(19deg) scale(1.05); } 60% { transform: rotate(-3deg); } }
.sticker {
  padding: 6px 14px; border: 2px solid var(--ink); border-radius: 999px; background: var(--lilac);
  font-weight: 800; font-size: 18px; line-height: 1.2; transform: rotate(-2deg);
}
.lede { max-width: 44ch; font-size: 20px; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 60px; padding: 12px 28px;
  border: 2px solid var(--ink); border-radius: 999px; background: var(--mint); color: var(--ink);
  font: 800 var(--fs-btn)/1.1 var(--font-body); text-decoration: none; box-shadow: 4px 4px 0 var(--ink);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn-ink { background: var(--ink); color: var(--mint); box-shadow: 4px 4px 0 var(--violet); }
.btn-ink:hover { box-shadow: 6px 6px 0 var(--violet); }
.foot { padding-block: 24px; background: var(--ink); color: var(--lilac); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="logo" href="./" data-to="" aria-label="Sidequest home">
      <span class="logo-mark" aria-hidden="true"><span class="logo-s">S</span></span>
      <span class="logo-word">sidequest</span>
    </a>
  </div>
</header>

<main class="wrap nf">
  <div class="nf-digits" aria-hidden="true"><span class="nf-d nf-d1">4</span><span class="nf-d nf-d2">0</span><span class="nf-d nf-d3">4</span></div>
  <p class="sticker">Error 404 · page not found</p>
  <h1>This quest doesn't exist.</h1>
  <p class="lede">The link might be old, or the page moved. Even the best sidequests take a wrong turn sometimes.</p>
  <div class="actions">
    <a class="btn btn-ink" href="./" data-to="">Back to home</a>
    <a class="btn" href="./#quiz" data-to="#quiz">Take the hobby quiz</a>
  </div>
</main>

<footer class="foot">
  <div class="wrap"><p>Sidequest – build yourself. A student project by Group 6 for INSY 440 at McGill.</p></div>
</footer>

<script>
  // Send people to the site's home, wherever it lives: a GitHub project page (/sidequest/) or the root of a domain.
  (function () {
    var first = location.pathname.split("/").filter(Boolean)[0];
    var project = /\.github\.io$/.test(location.hostname) && first && first.indexOf(".") === -1;
    var base = project ? "/" + first + "/" : "/";
    document.querySelectorAll("[data-to]").forEach(function (a) { a.href = base + a.getAttribute("data-to"); });
  })();
</script>
</body>
</html>
