<!-- Sidequest notices: "a spot opened", "a new time was added" and "your class is listed".
     Paste into a second EmailJS template (Content > Edit content > Code editor).
     Subject:  {{subject}}
     To Email: {{email}}
     Variables from index.html (sendNotice): to_name, subject, message. -->
<div style="margin:0;padding:24px;background:#FAF7FF;font-family:Arial,Helvetica,sans-serif;color:#1A1430;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#FFFFFF;border:2px solid #1A1430;border-radius:20px;">
    <tr>
      <td style="padding:24px 28px;background:#CFF7B5;border-bottom:2px dashed #1A1430;border-radius:18px 18px 0 0;">
        <p style="margin:0 0 6px;font-size:16px;font-weight:bold;">sidequest</p>
        <h1 style="margin:0;font-size:26px;line-height:1.25;">{{subject}}</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 28px;font-size:18px;line-height:1.5;">
        <p style="margin:0 0 16px;">Hi {{to_name}},</p>
        <p style="margin:0 0 16px;">{{message}}</p>
        <p style="margin:0;">See you soon,<br>The Sidequest team</p>
      </td>
    </tr>
  </table>
  <p style="max-width:560px;margin:16px auto 0;font-size:14px;color:#4E4766;text-align:center;">
    A student project by Group 6 for INSY 440 E-Business at McGill. Nothing is charged.
  </p>
</div>
